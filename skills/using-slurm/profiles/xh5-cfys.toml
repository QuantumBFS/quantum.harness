[identity]
name = "xh5-cfys"
purpose = "Secondary Issue 128 discovery and independent verification on hpccube Xiongheng"
maintainer = "Wander"

[connection]
repo_path_remote = "/work/home/cfys01/quantum-harness-issue128-hpc"
login_shell = false

[connection.ssh]
alias = "hpccube-xh5"
host = "xh5.hpccube.com"
user = "cfys01"
port = 65061

[scheduler]
type = "slurm"
default_partition = "xhacnormalb"

[[partitions]]
name = "xhacnormalb"
class = "default-cpu"
cores = 128
memory = "513500M"
max_wall = "333-08:00:00"
gpu = ""

[limits.hard]
max_walltime = "06:00:00"
max_nodes = 1
max_cpus = 32
max_array_size = 100

[limits.soft]
warn_walltime = "04:30:00"
warn_cpus = 16
unusual_partitions = []

[limits.paths]
allowed_roots = ["/work/home/cfys01/quantum-harness-issue128-hpc/results"]

[network]
internet_from_login = true
internet_from_compute = false

[region]
region = "mainland_china"

[commands]
squeue = "squeue -u $USER"
sacct = "sacct --format=JobID,State,ExitCode,MaxRSS,Elapsed"
sinfo = "sinfo -o '%P %a %.10l %.6D %.6t'"
quota_command = "sacctmgr -n -P show assoc where user=$USER format=Account,Partition,QOS,GrpTRES,MaxTRES"

[notes]
text = "Secondary account already had 36 running jobs at the 2026-07-31 probe. Do not use it to bypass shared account/QOS limits."
