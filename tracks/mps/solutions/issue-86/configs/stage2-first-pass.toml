# Incremental P=16 baseline. Stage 1 already contains L=16,32,64 at chi=64,
# so only the missing sizes needed for (8,16), (16,32), (24,48), and (32,64)
# crossing pairs are computed here.
[[sweeps]]
model = "long_range"
sigmas = [1.75]
lengths = [8, 24, 48]
gammas = [1.52, 1.54, 1.56, 1.58, 1.60]
chis = [64]
poles = [16]
tolerance = 1.0e-9
maxiter = 40
excited = false
seed = 86

