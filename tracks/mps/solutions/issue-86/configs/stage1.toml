# NN correlation-ratio crossings.
[[sweeps]]
model = "nn"
lengths = [16, 24, 32, 48, 64]
gammas = [0.98, 0.99, 1.0, 1.01, 1.02]
chis = [64]
tolerance = 1.0e-9
maxiter = 30
excited = false
seed = 86

# NN gap scaling at the exact critical field.
[[sweeps]]
model = "nn"
lengths = [16, 24, 32, 48, 64]
gammas = [1.0]
chis = [64, 128]
tolerance = 1.0e-9
maxiter = 40
excited = true
seed = 86

# Long-range L=16/32 first pass.
