[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmcrg-pure-neural-challenge"
version = "0.1.0"
description = "Pure neural renormalized Hamiltonians for two-dimensional Ising VMCRG"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "numba>=0.61",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
oracle = ["jax>=0.4"]
accelerator = ["jax>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
