[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chiral-graviton"
version = "0.1.0"
description = "Symmetry-resolved ED and neural variational calculation of the nu=1/3 chiral graviton gap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2",
  "scipy>=1.15",
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
plot = ["matplotlib>=3.10"]

[project.scripts]
chiral-graviton = "chiral_graviton.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chiral_graviton"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
