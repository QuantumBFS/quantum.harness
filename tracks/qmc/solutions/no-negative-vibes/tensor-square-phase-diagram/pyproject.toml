[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-square-phase"
version = "0.1.0"
description = "Reproducible ED and determinant-QMC study of the tensor-square model"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
