[package]
name = "learning-mit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = "0.4"
rand_xoshiro = "=0.8.1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
weak-self-dual = { path = "../weak-self-dual" }
