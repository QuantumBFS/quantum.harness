[project]
name = "challenge15-nqs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flax==0.10.2",
  "h5py==3.10.0",
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "matplotlib==3.10.9",
  "numpy==1.26.4",
  "optax==0.2.4",
  "pytest==8.3.4",
  "scipy==1.12.0",
  "sympy==1.13.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/challenge15"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "production: requires frozen source or target production infrastructure",
  "slow: larger combinatorial smoke tests for angular-momentum dimensions",
]
