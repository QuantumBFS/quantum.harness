[project]
name = "challenge148"
version = "0.1.0"
requires-python = "==3.12.13"
dependencies = [
  "contourpy==1.3.2",
  "h5py==3.14.0",
  "jsonschema==4.26.0",
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "pillow==12.2.0",
  "pytest==9.1.1",
  "scipy==1.15.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/challenge148"]

[tool.pytest.ini_options]
testpaths = ["tests"]
