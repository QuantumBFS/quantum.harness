[project]
name = "challenge-194-long-range-percolation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "h5py==3.14.0",
  "numba==0.66.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/long_range_percolation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
