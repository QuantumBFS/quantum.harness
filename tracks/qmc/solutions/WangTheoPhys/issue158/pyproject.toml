[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-harness-issue158"
version = "0.1.0"
description = "Reproducible theorem and public-data audit for Issue #158"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "mpmath>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
