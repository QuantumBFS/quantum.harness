[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xxzcert"
version = "0.1.0"
description = "Independent two-sided certificates for XXZ-chain energy densities"
requires-python = ">=3.11"
dependencies = [
  "cvxopt>=1.3",
  "cvxpy>=1.5",
  "matplotlib>=3.9",
  "mpmath>=1.3",
  "numpy>=2.0",
  "pydantic>=2.8",
  "python-flint>=0.9",
  "scipy>=1.13",
]

[project.scripts]
xxzcert = "xxzcert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
