[project]
name = "issue-119-variational-audit"
version = "0.1.0"
description = "Reproducible block2 DMRG audit for Quantum Advantage Tracker issue #119"
requires-python = "==3.12.*"
dependencies = [
  "block2==0.5.3",
  "matplotlib==3.11.0",
  "numpy==2.5.1",
  "psutil==7.2.2",
  "pyscf==2.13.1",
  "scipy==1.18.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: exercises installed scientific backends end-to-end",
]
