<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Optimization journeys for the multiplier and square-sum circuits</title>
  <desc id="desc">Two descending paths show the accepted exact gate counts for task C and task D.</desc>
  <defs>
    <linearGradient id="cLine" x1="0" x2="1">
      <stop offset="0" stop-color="#087f8c"/><stop offset="1" stop-color="#5746b8"/>
    </linearGradient>
    <linearGradient id="dLine" x1="0" x2="1">
      <stop offset="0" stop-color="#c56a19"/><stop offset="1" stop-color="#b83280"/>
    </linearGradient>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1120" height="650" rx="28" fill="#ffffff"/>
  <g stroke="#dbe4ec" stroke-width="1">
    <path d="M95 110H1060M95 160H1060M95 210H1060M95 260H1060"/>
    <path d="M95 390H1060M95 440H1060M95 490H1060M95 540H1060"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="56" y="72" fill="#087f8c" font-size="22" font-weight="800">C</text>
    <text x="94" y="72" fill="#17212b" font-size="17">6 × 6 multiplier</text>
    <text x="56" y="352" fill="#b85022" font-size="22" font-weight="800">D</text>
    <text x="94" y="352" fill="#17212b" font-size="17">x² + y²</text>
  </g>
  <path d="M120 116 L280 133 L440 150 L600 167 L800 232 L980 252"
        fill="none" stroke="url(#cLine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 394 L220 405 L320 416 L420 427 L520 438 L620 449 L700 471 L760 482 L850 504 L920 526 L990 537 L1040 548"
        fill="none" stroke="url(#dLine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#087f8c" stroke-width="4">
