    <circle cx="420" cy="427" r="7"/><circle cx="520" cy="438" r="7"/><circle cx="620" cy="449" r="7"/>
    <circle cx="700" cy="471" r="7"/><circle cx="760" cy="482" r="7"/><circle cx="850" cy="504" r="7"/>
    <circle cx="920" cy="526" r="7"/><circle cx="990" cy="537" r="7"/><circle cx="1040" cy="548" r="7"/>
