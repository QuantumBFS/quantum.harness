# OmniEvolve — #71 Occam's Circuit（OCCAM_INSTANCE 选择 practice / mystery）
# 用法（从 challenges/omnievolve 根目录）:
#   omnievolve run examples/occam_circuit/initial_code.py \
#       -e examples.occam_circuit.evaluator:OccamCircuitEvaluator \
#       -c configs/occam_circuit.toml --gens 30 --trusted
# 冒烟: 加 --gens 1。mystery 示例：先设置 OCCAM_INSTANCE=mystery-A。

[evolution]
max_generations = 110
population_size = 1
island_count = 1
novelty_threshold = 0.92
novelty_retry_limit = 3
mutation_rate = 0.3
crossover_rate = 0.15
max_stagnation_gens = 1000
token_budget = 2_000_000
compute_budget_sec = 0
sandbox_timeout = 300          # 四个 mystery 各运行候选+隔离验证
sandbox_mem_limit_mb = 512
health_window_gens = 5
self_evolve_enabled = false    # 先关 Slow Loop，纯测 Fast Loop

[selection]
parent_selector = "progressive_mcgs"
tournament_size = 3
pareto_enabled = true
island_migration_interval = 5

[models]
heavy = ["openai/qwen3.8-max-preview"]
light = ["openai/qwen3.8-max-preview"]
max_tokens = 4096             # Token Plan 强制 thinking；配合 low 档控制延迟
request_timeout = 300         # 阿里云百炼长代码生成需要超过默认 120s
reasoning_effort = "low"      # Token Plan 版本 thinking-only；默认 xhigh 会超时

[models.routing]
algorithm = "sliding_window_ucb"
window_size = 50
ucb_c = 1.414
cost_weight = 0.2
latency_weight = 0.1
role_conditioned = true

[embedding.code]
provider = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "default"
dimension = 1024
normalization = "provider_default"
input_type = "document"

[embedding.thought]
provider = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "default"
dimension = 1024
normalization = "l2"
input_type = "document"

[novelty]
embedding_gate = false            # Windows 本地竞赛运行跳过慢速 Qwen 向量初始化
ast_gate = true
behavior_gate = false
llm_judge_on_borderline = true
borderline_low = 0.88
borderline_high = 0.96

[sandbox]
backend = "trusted_subprocess"
timeout_sec = 300
mem_limit_mb = 512
cpu_limit = 1.0
pids_limit = 64
network_mode = "none"
read_only_root = false           # 候选需写 circuit.txt
run_as_non_root = true
drop_capabilities = true
no_new_privileges = true
language = "python"

[storage]
code_backend = "cas"
db_path = ".omnievolve/occam_suite_qwen38_feedback_v18.db"
vector_dir = ".omnievolve/vectors"
artifact_dir = ".omnievolve/artifacts"
export_dir = ".omnievolve/exports"

[storage.jobs]
lease_sec = 90
heartbeat_sec = 20
max_attempts = 3

[memory]
default_top_k = 8
scope_weights = { L0 = 1.0, L1 = 0.9, L2 = 0.6, L3 = 0.4, L4 = 0.2 }
ablation_interval_gens = 10

[self_evaluator]
roi_warn_threshold = 0.001
entropy_warn_threshold = 0.35
stagnation_trigger = 3
window_gens = 3
require_confidence_interval = true

[meta_evolution]
enabled = false
prompt_mutation_rate = 0.2
meta_canary_budget_ratio = 0.1
promotion_min_gain = 0.02
promotion_max_regression = 0.005
require_replay_for_l1 = true
auto_apply_l0 = true
allow_l2_actions = false

[evaluation_governance]
immutable_task_semantics = true
immutable_correctness_tests = true
immutable_hidden_data = true
immutable_score_formula = true
allow_environment_adaptation = true
require_baseline_recheck = true
require_elite_rank_stability = true
