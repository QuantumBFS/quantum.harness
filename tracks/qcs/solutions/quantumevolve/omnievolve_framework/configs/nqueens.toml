# OmniEvolve — #34 N-queens TN 精确收缩（N=8 起步）
# 用法（从 challenges/omnievolve 根目录）:
#   omnievolve run examples/nqueens/initial_code.py \
#       -e examples.nqueens.evaluator:NQueensEvaluator \
#       -c configs/nqueens.toml --gens 30 --trusted
# 冒烟: 加 --gens 3。

[evolution]
max_generations = 30
population_size = 4
island_count = 2
novelty_threshold = 0.92
novelty_retry_limit = 3
mutation_rate = 0.3
crossover_rate = 0.15
max_stagnation_gens = 5
token_budget = 2_000_000
compute_budget_sec = 0
sandbox_timeout = 125          # 候选 100s + 验证器 10s + 余量
sandbox_mem_limit_mb = 2048    # TN 收缩可能需较大内存
health_window_gens = 5
self_evolve_enabled = false

[selection]
parent_selector = "progressive_mcgs"
tournament_size = 3
pareto_enabled = true
island_migration_interval = 5

[models]
heavy = ["openai/glm-5.2"]
light = ["openai/glm-5.2"]
max_tokens = 4096
request_timeout = 120
reasoning_effort = "low"

[models.routing]
algorithm = "sliding_window_ucb"
window_size = 50
ucb_c = 1.414
cost_weight = 0.2
latency_weight = 0.1
role_conditioned = true

[embedding.code]
provider = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "default"
dimension = 1024
normalization = "provider_default"
input_type = "document"

[embedding.thought]
provider = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "default"
dimension = 1024
normalization = "l2"
input_type = "document"

[novelty]
embedding_gate = true
ast_gate = true
behavior_gate = false
llm_judge_on_borderline = true
borderline_low = 0.88
borderline_high = 0.96

[sandbox]
backend = "trusted_subprocess"
timeout_sec = 125
mem_limit_mb = 2048
cpu_limit = 1.0
pids_limit = 64
network_mode = "none"
read_only_root = false
run_as_non_root = true
drop_capabilities = true
no_new_privileges = true
language = "python"

[storage]
code_backend = "cas"
db_path = ".omnievolve/nqueens_glm52_v1.db"
vector_dir = ".omnievolve/vectors"
artifact_dir = ".omnievolve/artifacts"
export_dir = ".omnievolve/exports"

[storage.jobs]
lease_sec = 150
heartbeat_sec = 20
max_attempts = 3

[memory]
default_top_k = 8
scope_weights = { L0 = 1.0, L1 = 0.9, L2 = 0.6, L3 = 0.4, L4 = 0.2 }
ablation_interval_gens = 10

[self_evaluator]
roi_warn_threshold = 0.001
entropy_warn_threshold = 0.35
stagnation_trigger = 3
window_gens = 3
require_confidence_interval = true

[meta_evolution]
enabled = false
prompt_mutation_rate = 0.2
meta_canary_budget_ratio = 0.1
promotion_min_gain = 0.02
promotion_max_regression = 0.005
require_replay_for_l1 = true
auto_apply_l0 = true
allow_l2_actions = false

[evaluation_governance]
immutable_task_semantics = true
immutable_correctness_tests = true
immutable_hidden_data = true
immutable_score_formula = true
allow_environment_adaptation = true
require_baseline_recheck = true
require_elite_rank_stability = true
